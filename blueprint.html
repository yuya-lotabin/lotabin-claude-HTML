  <style>
    html, body { height: 100%; background: var(--ink-900); }
    body { margin: 0; overflow: hidden; }
    #root { height: 100%; }
    .grain::before { z-index: 70; }

    /* Blueprint-desk-only rail flourishes (built on the shared if-* system) */
    .bp-rail-card {
      margin-top: var(--s-5);
      border: 1px solid var(--if-line-strong);
      border-radius: 14px;
      padding: var(--s-5);
      background: linear-gradient(180deg, color-mix(in oklab, var(--if-accent) 10%, transparent), transparent);
      display: flex; flex-direction: column; gap: 6px;
    }
    .bp-rail-ic { width: 22px; height: 22px; color: var(--if-accent); }
    .bp-rail-name { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: -.01em; margin-top: 6px; }
    .bp-rail-price { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--if-accent); }
    .bp-rail-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .bp-rail-list li { font-size: .82rem; line-height: 1.35; color: var(--fg-muted); padding-left: 16px; position: relative; }
    .bp-rail-list li::before { content: ""; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--if-accent); opacity: .7; }

    .bp-note {
      margin-top: var(--s-6);
      font-family: var(--font-mono); font-size: .68rem; line-height: 1.6;
      letter-spacing: .04em; color: var(--fg-muted);
      border-left: 2px solid var(--if-line-strong); padding-left: 14px; max-width: 60ch;
    }
  </style>

  <link rel="canonical" href="https://lotabin.com/blueprint.html" />
</head>

</body>
